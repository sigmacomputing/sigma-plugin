name: Release

# Merging a version bump is the approval to publish. When main carries a
# version with no release yet, tag it and attach one .plugin archive per
# plugin. A merge that doesn't change the version finds its release already
# there and does nothing, and so does a main with no plugins in it yet.
#
# Only main publishes, and there is no manual trigger: a run from any other
# branch would publish that branch's unreviewed content, and tags here can't
# be moved or deleted.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Two quick merges must not race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every plugin carries the same version; the tag is built from it, so
      # anything other than X.Y.Z is refused before it reaches a tag name.
      - name: Work out the version
        id: version
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          manifests = sorted(glob.glob("plugins/claude/*/.claude-plugin/plugin.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              if not manifests:
                  print("No plugins yet; nothing to release.")
                  out.write("none=true\n")
                  raise SystemExit
              versions = {json.load(open(m))["version"] for m in manifests}
              if len(versions) != 1:
                  raise SystemExit(f"Plugins disagree on the version: {sorted(versions)}")
              version = versions.pop()
              if not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  raise SystemExit(f"Version {version!r} isn't X.Y.Z")
              out.write(f"tag=v{version}-beta\n")
              out.write(f"slug=v{version.replace('.', '-')}-beta\n")
          PY

      # An existing release is fine only if it was cut from main and the
      # plugins haven't changed since. Otherwise this version was published
      # from somewhere else, or the plugins changed without a version bump,
      # and quietly skipping would leave main and the release disagreeing.
      - name: Check whether this version is already released
        id: released
        if: steps.version.outputs.none != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG...$GITHUB_SHA" -q .status)"
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::$TAG was released from a commit that isn't on main."
            exit 1
          fi
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG...$GITHUB_SHA" -q '[.files[]?.filename | select(startswith("plugins/") or startswith(".claude-plugin/"))] | length')"
          if [ "$changed" != "0" ]; then
            echo "::error::The plugins changed since $TAG without a version bump."
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Archive each plugin
        if: steps.released.outputs.exists == 'false'
        env:
          SLUG: ${{ steps.version.outputs.slug }}
        run: |
          mkdir dist
          for dir in plugins/claude/*/; do
            name="$(basename "$dir")"
            # -y stores a symlink as a link instead of following it.
            (cd "$dir" && zip -qry "../../../dist/${name}-${SLUG}.plugin" . -x '*.DS_Store')
          done

      - name: Publish the release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.plugin --target "$GITHUB_SHA" --title "$TAG" --prerelease --generate-notes
